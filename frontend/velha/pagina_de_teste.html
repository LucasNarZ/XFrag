<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Faixa com CSS separado</title>
  <!-- link para o arquivo CSS externo -->
  <link rel="stylesheet" href="pagina_de_teste.css">

  
</head>
<body>
  <!-- sua faixa azul -->
  <div class="faixa">




  </div>

  <!-- quadros iguais -->
  <div class="retangulo"></div>
  <div class="retangulo"></div>
  <div class="retangulo"></div>

  <!-- quadro diferente -->
  <div class="retangulo-diferente"></div>


  <!-- quadro identificao -->
  <div class="retangulo-identificao"></div>
  
  <!-- quadro do grafico -->
  <div class="retangulo-grafico"></div>

<!-- botão de menu com ícone -->
<button class="botao-menu">
  <img src="icones/menu.png" class="botao-menu">
</button>

<!-- botão de pessoa com ícone -->
<button class="botao-pessoa">
  <img src="icones/pesssoa.png" class="botao-pessoa">
</button>


<!-- botão de sino com ícone -->
<button class="botao-sino">
  <img src="icones/sino.png" class="botao-sino">
</button>

<!-- botão de casa com ícone e texto -->
<button class="botao-casa">
  <img src="icones/casa.png" alt="Casa" class="icone">
  <span class="texto-botao">INICIO |</span>
</button>

<!-- botão de calculadora com ícone e texto -->
<button class="botao-calculadora">
  <img src="icones/calculadora.png" alt="Calculadora" class="icone">
  <span class="texto-botao">Calcular Score</span>
</button>

<!-- botão de Limpar Seleção com ícone e texto -->
<button class="botao-voltar">
  <img src="icones/voltar.png" alt="Calculadora" class="icone">
  <span class="texto-botao">Limpar Seleção</span>
</button>

</button>



</button>

</body>



</body>




</html>
